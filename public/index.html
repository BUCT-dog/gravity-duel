<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>🪐 引力对决 Gravity Duel</title>
<style>
  :root{--bg:#08081a;--text:#e0e0f0;--dim:rgba(255,255,255,.45);--blue:#4da6ff;--red:#ff5555;--gold:#f9c74f}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'Segoe UI',system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  body{display:flex;justify-content:center;align-items:center}
  #app{position:relative;width:1200px;height:700px;max-width:100vw;max-height:100vh;transform-origin:center center}
  canvas{display:block;width:100%;height:100%;border-radius:14px;box-shadow:0 0 100px rgba(60,100,255,.12),0 0 30px rgba(0,0,0,.6)}

  #connBadge{position:absolute;top:14px;right:20px;z-index:30;font-size:11px;font-weight:600;padding:5px 12px;border-radius:20px;pointer-events:none;transition:all .3s}
  #connBadge.online{background:rgba(16,185,129,.2);color:#10b981}
  #connBadge.offline{background:rgba(239,68,68,.2);color:#ef4444}

  #joystickZone{display:none;position:absolute;bottom:0;left:0;width:45%;height:100%;z-index:15}
  #joystickBase{position:absolute;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.18);bottom:40px;left:50px;pointer-events:none}
  #joystickThumb{position:absolute;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.25);box-shadow:0 0 20px rgba(255,255,255,.15);pointer-events:none;transition:none}
  .mobile #app{width:100vw;height:100dvh;max-width:none;max-height:none;transform:none}
  .mobile canvas{border-radius:0}
  .mobile.game-active #joystickZone,.mobile.game-active #joystickBase,.mobile.game-active #joystickThumb{display:block}

  .overlay{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;pointer-events:none;z-index:10}
  .overlay.active{pointer-events:auto}
  .panel{background:rgba(16,16,38,.94);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:34px 36px;text-align:center;color:var(--text);box-shadow:0 24px 80px rgba(0,0,0,.55);max-width:420px;width:90%;animation:fadeUp .35s ease-out;max-height:90vh;overflow-y:auto}
  @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  .panel h1{font-size:28px;font-weight:700;margin-bottom:4px}
  .panel .icon{font-size:40px;display:block;margin-bottom:2px}
  .panel .sub{font-size:13px;color:var(--dim);margin-bottom:22px;line-height:1.5}

  .btn{display:inline-block;padding:13px 28px;border-radius:50px;font-size:15px;font-weight:600;cursor:pointer;border:none;color:#fff;letter-spacing:.03em;transition:all .2s;font-family:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  .btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(0,0,0,.35)}
  .btn:active{transform:translateY(0)}
  .btn-primary{background:linear-gradient(135deg,#4da6ff,#6c5ce7)}
  .btn-ghost{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.75)}
  .btn-block{display:block;width:100%}
  .btn+.btn{margin-top:9px}

  .input-row{display:flex;gap:8px;margin:14px 0}
  .input-row input{flex:1;padding:13px 16px;border-radius:50px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:#fff;font-size:18px;text-align:center;letter-spacing:.18em;text-transform:uppercase;outline:none;font-family:inherit;transition:border-color .2s}
  .input-row input:focus{border-color:var(--blue)}
  .input-row input::placeholder{color:rgba(255,255,255,.2);letter-spacing:.03em;font-size:14px}

  .room-code-big{font-size:52px;font-weight:900;letter-spacing:.16em;color:var(--gold);text-shadow:0 0 36px rgba(249,199,79,.4);margin:8px 0}
  .share-link{font-size:12px;color:var(--dim);margin:6px 0 16px;word-break:break-all}
  .copied-pop{display:inline-block;font-size:12px;color:#10b981;margin-left:8px;opacity:0;transition:opacity .2s}
  .copied-pop.show{opacity:1}

  #hud{position:absolute;top:14px;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:0 20px;z-index:5;pointer-events:none}
  .hp-row{display:flex;align-items:center;gap:6px;min-width:140px}
  .hp-label{font-size:11px;font-weight:700;color:#fff;text-shadow:0 0 8px rgba(255,255,255,.4);white-space:nowrap}
  .hp-track{width:120px;height:7px;border-radius:7px;background:rgba(255,255,255,.08);overflow:hidden}
  .hp-fill{height:100%;border-radius:7px;transition:width .35s ease-out}
  .hp-fill.p1{background:linear-gradient(90deg,#4da6ff,#8167f0);box-shadow:0 0 10px rgba(77,166,255,.5)}
  .hp-fill.p2{background:linear-gradient(90deg,#ff5555,#e74c3c);box-shadow:0 0 10px rgba(255,85,85,.5)}

  #timerDisplay{font-size:24px;font-weight:800;color:#fff;text-shadow:0 0 14px rgba(255,255,255,.35);min-width:56px;text-align:center}
  #timerDisplay.urgent{color:#ff5555;animation:pulse .5s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  #toast{position:absolute;top:46%;left:50%;transform:translate(-50%,-50%);font-size:32px;font-weight:900;color:#fff;text-shadow:0 0 40px rgba(255,255,255,.7);z-index:25;pointer-events:none;opacity:0;transition:opacity .25s;text-align:center}
  #toast.show{opacity:1}

  .tips{margin-top:16px;font-size:11px;color:rgba(255,255,255,.22);line-height:1.7;text-align:left;padding-left:8px}
  .tips span{color:rgba(255,255,255,.4)}
  .hidden{display:none!important}

  #serverScope{margin:14px 0 2px;padding:9px 12px;border:1px solid rgba(92,214,180,.18);border-radius:12px;background:rgba(92,214,180,.07);color:rgba(196,255,237,.75);font-size:11px;line-height:1.5}
  #fpsDisplay{position:absolute;bottom:16px;left:16px;z-index:8;font-size:10px;color:rgba(255,255,255,.25);pointer-events:none}

  @media(max-width:600px){
    .panel{width:calc(100% - 24px);padding:24px 20px;border-radius:18px}
    .panel h1{font-size:24px}.panel .icon{font-size:34px}
    .hp-row{min-width:96px;gap:4px}.hp-track{width:68px}.hp-label{font-size:10px}
    #hud{top:max(10px,env(safe-area-inset-top));padding:0 max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left))}
    #timerDisplay{min-width:46px;font-size:19px}
    #connBadge{top:max(46px,calc(env(safe-area-inset-top)+38px));right:12px}
    #joystickBase{width:116px;height:116px;bottom:max(24px,env(safe-area-inset-bottom));left:24px}
    #joystickThumb{width:52px;height:52px}
    #toast{width:86%;font-size:24px}
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <div id="connBadge" class="offline">● 未连接</div>
  <div id="joystickZone"><div id="joystickBase"></div><div id="joystickThumb"></div></div>
  <div id="fpsDisplay"></div>

  <div id="hud" class="hidden">
    <div class="hp-row"><span class="hp-label" style="color:#4da6ff">🔵 我方</span><div class="hp-track"><div class="hp-fill p1" id="hp1" style="width:100%"></div></div></div>
    <div id="timerDisplay">3:00</div>
    <div class="hp-row" style="flex-direction:row-reverse"><span class="hp-label" style="color:#ff5555;text-align:right">对手 🔴</span><div class="hp-track"><div class="hp-fill p2" id="hp2" style="width:100%"></div></div></div>
  </div>
  <div id="toast"></div>

  <div class="overlay active" id="menuOverlay"><div class="panel">
    <h1><span class="icon">🪐</span>引力对决</h1>
    <div class="sub">操纵行星引力场，甩陨石摧毁对手！</div>
    <div id="serverScope"></div>
    <button class="btn btn-primary btn-block" onclick="createRoom()">🎮 创建房间</button>
    <div style="margin:10px 0;color:rgba(255,255,255,.2);font-size:12px">— 或输入房间码加入 —</div>
    <div class="input-row"><input id="joinInput" placeholder="房间码" maxlength="4" autocomplete="off" autocorrect="off" autocapitalize="characters" inputmode="text"><button class="btn btn-ghost" onclick="joinRoom()">加入</button></div>
    <div class="tips"><span>🕹️</span> PC: WASD/方向键 | 📱 手机: 虚拟摇杆<br><span>🧲</span> 引力圈捕获陨石→甩向对手<br><span>💥</span> 5条命/3分钟</div>
  </div></div>

  <div class="overlay hidden" id="waitOverlay"><div class="panel">
    <h1>⏳ 等待对手</h1><div class="room-code-big" id="roomCodeDisplay"></div><div class="share-link" id="shareLink"></div>
    <button class="btn btn-primary btn-block" onclick="copyShare()">📋 复制邀请链接<span class="copied-pop" id="copiedPop">✓ 已复制</span></button>
    <button class="btn btn-ghost btn-block" onclick="copyCode()">📋 仅复制房间码</button>
    <button class="btn btn-ghost btn-block" onclick="leaveWait()" style="margin-top:4px">取消</button>
  </div></div>

  <div class="overlay hidden" id="endOverlay"><div class="panel" id="endPanel"></div></div>
</div>

<script>
// ====== 常量 ======
const W=1200,H=700,PR=38,GR=230,PS=4.5,MAX_HP=5;

// ====== DOM ======
const c=document.getElementById('c'),ctx=c.getContext('2d');
c.width=W; c.height=H;
const cn=document.getElementById('connBadge'),hud=document.getElementById('hud'),
  hp1=document.getElementById('hp1'),hp2=document.getElementById('hp2'),
  td=document.getElementById('timerDisplay'),toast=document.getElementById('toast'),
  menuOv=document.getElementById('menuOverlay'),waitOv=document.getElementById('waitOverlay'),
  endOv=document.getElementById('endOverlay'),endP=document.getElementById('endPanel'),
  app=document.getElementById('app'),jb=document.getElementById('joystickBase'),
  jt=document.getElementById('joystickThumb'),jz=document.getElementById('joystickZone'),
  ss=document.getElementById('serverScope'),fpsEl=document.getElementById('fpsDisplay');

const isMobile=/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)||('ontouchstart' in window&&innerWidth<1024)||innerWidth<=600;
const isLocal=/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
ss.textContent=isLocal?'⚠ 本机房间·手机无法加入':'🌐 公网联机·'+location.host;
if(isMobile){document.body.classList.add('mobile');app.style.width='100vw';app.style.height='100dvh';app.style.maxWidth='none';app.style.maxHeight='none';app.style.transform='none'}

// ====== 状态 ======
let ws=null,myNum=0,myRoom='',conOK=false;
let keys={up:false,down:false,left:false,right:false},prevKeys={...keys};
let effects=[],shake=0;
let stars=Array.from({length:160},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.2,p:Math.random()*Math.PI*2,s:Math.random()*.016+.004}));

// ====== 客户端预测 + 插值 ======
let predX=180,predY=H/2;          // 本地预测位置
let prevSt=null,curSt=null;       // 上一帧/当前帧服务器状态
let stTime=0;                     // 收到 curSt 的时间
let lastInputSend=0;

function lerp(a,b,t){return a+(b-a)*t}
function clamp(v,lo,hi){return v<lo?lo:v>hi?hi:v}

function applyPrediction() {
  if(!curSt||curSt.state!=='playing')return;
  // 本地预测：根据按键立即更新位置
  let dx=0,dy=0;
  if(keys.up)dy-=1;if(keys.down)dy+=1;if(keys.left)dx-=1;if(keys.right)dx+=1;
  if(dx&&dy){dx*=.7071;dy*=.7071}
  predX=clamp(predX+dx*PS,PR,W-PR);
  predY=clamp(predY+dy*PS,PR,H-PR);
}

// 收到服务端状态时做 reconciliation
function onServerState(st) {
  prevSt=curSt; curSt=st; stTime=performance.now();
  if(!prevSt) prevSt=st; // 首帧

  // Reconciliation：比较预测位置和服务端位置
  const me=st.players.find(p=>p.n===myNum);
  if(me){
    const dist=Math.hypot(predX-me.x,predY-me.y);
    if(dist>15){
      // 偏差大 → 快速拉回
      predX=lerp(predX,me.x,.4);
      predY=lerp(predY,me.y,.4);
    }else if(dist>5){
      // 偏差小 → 缓慢修正
      predX=lerp(predX,me.x,.15);
      predY=lerp(predY,me.y,.15);
    }
  }
}

// 获取插值后的位置
function getInterp(t){
  if(!prevSt||!curSt)return curSt;
  const c=Math.min(Math.max(t,0),1);

  const players=curSt.players.map(cp=>{
    const pp=prevSt.players.find(p=>p.n===cp.n);
    if(!pp)return{...cp};
    return{n:cp.n,hp:cp.hp,x:lerp(pp.x,cp.x,c),y:lerp(pp.y,cp.y,c)};
  });

  const asteroids=curSt.asteroids.map((ca,i)=>{
    const pa=prevSt.asteroids[i];
    if(!pa)return{...ca};
    return{x:lerp(pa.x,ca.x,c),y:lerp(pa.y,ca.y,c),vx:ca.vx,vy:ca.vy,r:ca.r};
  });

  return{players,asteroids,time:curSt.time,state:curSt.state,winner:curSt.winner};
}

// ====== 摇杆 ======
let jActive=false,jId=null,jCX=0,jCY=0,jMR=55;
function updJ(){const r=jb.getBoundingClientRect();jCX=r.left+r.width/2;jCY=r.top+r.height/2;jMR=r.width/2-30}
jz.addEventListener('touchstart',e=>{e.preventDefault();for(const t of e.changedTouches){if(!jActive){jActive=true;jId=t.identifier;updJ();mvJ(t.clientX,t.clientY)}}},{passive:false});
jz.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches){if(t.identifier===jId)mvJ(t.clientX,t.clientY)}},{passive:false});
jz.addEventListener('touchend',e=>{e.preventDefault();for(const t of e.changedTouches){if(t.identifier===jId){jActive=false;jId=null;rstJ()}}},{passive:false});
jz.addEventListener('touchcancel',()=>{jActive=false;jId=null;rstJ()});
function mvJ(cx,cy){let dx=cx-jCX,dy=cy-jCY;const d=Math.hypot(dx,dy);if(d>jMR){dx=dx/d*jMR;dy=dy/d*jMR}jt.style.left=(jCX+dx-28)+'px';jt.style.top=(jCY+dy-28)+'px';const dz=10;keys.up=dy<-dz;keys.down=dy>dz;keys.left=dx<-dz;keys.right=dx>dz}
function rstJ(){jt.style.left=(jCX-28)+'px';jt.style.top=(jCY-28)+'px';keys={up:false,down:false,left:false,right:false}}
window.addEventListener('resize',()=>{if(isMobile){app.style.width='100vw';app.style.height='100dvh';app.style.maxWidth='none';app.style.maxHeight='none';app.style.transform='none'}if(jActive)updJ()});

// ====== WebSocket ======
function connect(){
  if(ws&&ws.readyState===WebSocket.OPEN)return;
  const proto=location.protocol==='https:'?'wss:':'ws:';
  ws=new WebSocket(proto+'//'+location.host);
  ws.onopen=()=>{conOK=true;cn.textContent='● 已连接';cn.className='online';
    const p=sessionStorage.getItem('pendingJoin');if(p){sessionStorage.removeItem('pendingJoin');joinRC(p)}};
  ws.onclose=()=>{conOK=false;cn.textContent='● 断线重连中';cn.className='offline';setTimeout(connect,2000)};
  ws.onmessage=e=>{
    const m=JSON.parse(e.data);
    switch(m.type){
      case'room_created':myNum=m.player;myRoom=m.roomId;document.getElementById('roomCodeDisplay').textContent=m.roomId;document.getElementById('shareLink').innerHTML='分享链接：<br><code style="font-size:11px;color:rgba(255,255,255,.5);word-break:break-all;">'+location.origin+'?join='+m.roomId+'</code>';menuOv.classList.add('hidden');waitOv.classList.remove('hidden');sessionStorage.setItem('myRoom',m.roomId);sessionStorage.setItem('myNum',m.player);break;
      case'joined':myNum=m.player;myRoom=m.roomId;menuOv.classList.add('hidden');waitOv.classList.add('hidden');sessionStorage.setItem('myRoom',m.roomId);sessionStorage.setItem('myNum',m.player);break;
      case'game_start':
        predX=myNum===1?180:W-180;predY=H/2;prevSt=null;curSt=null;
        hud.classList.remove('hidden');waitOv.classList.add('hidden');endOv.classList.remove('active');endOv.classList.add('hidden');
        document.body.classList.add('game-active');if(isMobile)requestAnimationFrame(()=>{updJ();rstJ()});
        effects=[];shake=0;showToast(myNum===1?'🔵 蓝色行星':'🔴 红色行星');break;
      case'game_state':onServerState(m);break;
      case'game_over':showEnd(m.winner);break;
      case'hit':effects.push({x:m.x,y:m.y,life:1,player:m.player});if(m.player===myNum){shake=14;beep(180,.18,'sawtooth');setTimeout(()=>beep(120,.2,'triangle'),100)}else{beep(700,.08,'square');setTimeout(()=>beep(900,.06,'square'),60)}break;
      case'rematch_requested':showToast('对手也想再来一局');break;
      case'opponent_disconnected':showToast('对手断开连接');setTimeout(()=>{document.body.classList.remove('game-active');endP.innerHTML='<h1>🏆</h1><p style="font-size:18px">对手断开连接</p><p style="color:var(--dim)">你赢了！</p><button class="btn btn-primary btn-block" onclick="backToMenu()">返回大厅</button>';endOv.classList.remove('hidden');endOv.classList.add('active');hud.classList.add('hidden')},2000);break;
      case'error':showToast(m.message);break;
    }
  };
}

// ====== 操作 ======
function createRoom(){if(!conOK){connect();setTimeout(createRoom,400);return}ws.send(JSON.stringify({type:'create_room'}))}
function joinRoom(){const code=document.getElementById('joinInput').value.trim().toUpperCase();if(!code)return;if(!conOK){connect();sessionStorage.setItem('pendingJoin',code);setTimeout(joinRoom,400);return}joinRC(code)}
function joinRC(code){if(!conOK){connect();setTimeout(()=>joinRC(code),400);return}ws.send(JSON.stringify({type:'join_room',roomId:code}))}
function copyShare(){copyT(location.origin+'?join='+myRoom);const el=document.getElementById('copiedPop');el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}
function copyCode(){copyT(myRoom);showToast('已复制房间码！')}
function copyT(text){let done=false;if(navigator.clipboard?.writeText){const to=new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),1000));Promise.race([navigator.clipboard.writeText(text),to]).then(()=>{done=true}).catch(()=>{})}setTimeout(()=>{if(done)return;const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;top:50%;left:50%;width:1px;height:1px;opacity:0;pointer-events:none';ta.setAttribute('readonly','');document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,999999);try{document.execCommand('copy');done=true}catch(e){}document.body.removeChild(ta);if(!done)prompt('复制下面的内容（会自动选中）：',text)},300)}
function leaveWait(){if(ws){ws.close();ws=null}curSt=null;prevSt=null;myRoom='';myNum=0;document.body.classList.remove('game-active');hud.classList.add('hidden');waitOv.classList.add('hidden');menuOv.classList.remove('hidden');sessionStorage.removeItem('myRoom');sessionStorage.removeItem('myNum');connect()}
function backToMenu(){if(ws){ws.close();ws=null}curSt=null;prevSt=null;myRoom='';myNum=0;document.body.classList.remove('game-active');hud.classList.add('hidden');waitOv.classList.add('hidden');endOv.classList.remove('active');endOv.classList.add('hidden');menuOv.classList.remove('hidden');sessionStorage.removeItem('myRoom');sessionStorage.removeItem('myNum');connect()}
function rematch(){if(ws?.readyState===WebSocket.OPEN){ws.send(JSON.stringify({type:'rematch'}));endOv.classList.remove('active');endOv.classList.add('hidden')}}
function showEnd(w){document.body.classList.remove('game-active');hud.classList.add('hidden');endOv.classList.remove('hidden');endOv.classList.add('active');const m={win:['🎉','你赢了！','引力至尊！','var(--gold)'],lose:['💀','你输了','再来一局！',''],draw:['🤝','平局','旗鼓相当！','']}[w===myNum?'win':w===0?'draw':'lose'];endP.innerHTML='<h1>'+m[0]+'</h1><p style="font-size:21px;font-weight:700;'+(m[3]?'color:'+m[3]:'')+'">'+m[1]+'</p><p style="color:var(--dim)">'+m[2]+'</p><button class="btn btn-primary btn-block" onclick="rematch()">🔄 再来一局</button><button class="btn btn-ghost btn-block" onclick="backToMenu()">退出</button>'}

let tt;function showToast(tx){clearTimeout(tt);toast.textContent=tx;toast.classList.add('show');tt=setTimeout(()=>toast.classList.remove('show'),2200)}

// ====== 音频 ======
let acx=null;function ac(){if(!acx)acx=new(window.AudioContext||window.webkitAudioContext)();return acx}
function beep(f,d,t){try{const a=ac(),o=a.createOscillator(),g=a.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(.1,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}catch(e){}}

// ====== 键盘 ======
const km={};
window.addEventListener('keydown',e=>{km[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault()});
window.addEventListener('keyup',e=>{km[e.code]=false});
function readKeys(){if(!jActive){keys={up:!!(km.KeyW||km.ArrowUp),down:!!(km.KeyS||km.ArrowDown),left:!!(km.KeyA||km.ArrowLeft),right:!!(km.KeyD||km.ArrowRight)}}}

// 高频发送输入
setInterval(()=>{
  readKeys();
  const ch=keys.up!==prevKeys.up||keys.down!==prevKeys.down||keys.left!==prevKeys.left||keys.right!==prevKeys.right;
  if((ch||performance.now()-lastInputSend>80)&&ws?.readyState===WebSocket.OPEN){
    ws.send(JSON.stringify({type:'input',keys}));
    prevKeys={...keys};lastInputSend=performance.now();
  }
},16);

// ====== 渲染 ======
let fpsFrames=0,fpsTime=performance.now(),fpsVal=0;

function render(now){
  requestAnimationFrame(render);

  // FPS
  fpsFrames++; if(now-fpsTime>=1000){fpsVal=fpsFrames;fpsFrames=0;fpsTime=now;fpsEl.textContent=fpsVal+' fps'}

  // 预测本地位置
  applyPrediction();

  // 插值
  const interpT=curSt?Math.min((now-stTime)/55,1.2):0;
  const is=curSt&&curSt.state==='playing'?getInterp(interpT):null;

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#08081c';ctx.fillRect(0,0,W,H);

  // 网格 (lightweight, every frame)
  ctx.strokeStyle='rgba(255,255,255,.012)';ctx.lineWidth=1;
  for(let x=0;x<W;x+=80){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  for(let y=0;y<H;y+=80){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}

  // 星空
  for(const s of stars){s.p+=s.s;ctx.fillStyle='rgba(255,255,255,'+(.3+Math.sin(s.p)*.3)+')';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}

  // 震屏
  let sx=0,sy=0;
  if(shake>0){sx=(Math.random()-.5)*shake*2;sy=(Math.random()-.5)*shake*2;shake*=.84;if(shake<.3)shake=0}

  ctx.save();ctx.translate(sx,sy);

  // 演示模式
  if(!is){
    const dt=now/1000;
    // 演示陨石
    for(let i=0;i<10;i++){const ax=(i*173+dt*40)%(W+100)-50,ay=(i*257+dt*30)%(H+100)-50,ar=6+i%6;ctx.fillStyle='rgba(255,200,140,'+(.2+i%5*.05)+')';ctx.beginPath();ctx.arc(ax,ay,ar,0,Math.PI*2);ctx.fill()}
    // 演示行星
    for(const dp of[{x:W*.28,y:H*.5+Math.sin(dt)*40,c:'rgba(77,166,255,.6)'},{x:W*.72,y:H*.5+Math.cos(dt)*40,c:'rgba(255,85,85,.6)'}]){
      const dg=ctx.createRadialGradient(dp.x,dp.y,PR*.5,dp.x,dp.y,PR*2);dg.addColorStop(0,dp.c);dg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=dg;ctx.beginPath();ctx.arc(dp.x,dp.y,PR*2,0,Math.PI*2);ctx.fill()
      const db=ctx.createRadialGradient(dp.x-8,dp.y-10,PR*.15,dp.x,dp.y,PR);db.addColorStop(0,'rgba(255,255,255,.3)');db.addColorStop(.25,dp.c);db.addColorStop(1,'rgba(0,0,0,.5)');ctx.fillStyle=db;ctx.beginPath();ctx.arc(dp.x,dp.y,PR,0,Math.PI*2);ctx.fill()
    }
  }

  // 游戏渲染（插值后）
  if(is){
    for(const p of is.players){
      const color=p.n===1?'rgba(77,166,255,.18)':'rgba(255,85,85,.18)';
      // 引力场
      const gg=ctx.createRadialGradient(p.x,p.y,PR,p.x,p.y,GR);gg.addColorStop(0,color);gg.addColorStop(.45,'rgba(0,0,0,.02)');gg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=gg;ctx.beginPath();ctx.arc(p.x,p.y,GR,0,Math.PI*2);ctx.fill()
      // 行星（用自己的预测位置替换）
      const rx=p.n===myNum?predX:p.x,ry=p.n===myNum?predY:p.y;
      const c2=p.n===1?'rgba(77,166,255,.9)':'rgba(255,85,85,.9)';
      const gl=ctx.createRadialGradient(rx,ry,PR*.5,rx,ry,PR*2.4);gl.addColorStop(0,c2);gl.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=gl;ctx.beginPath();ctx.arc(rx,ry,PR*2.4,0,Math.PI*2);ctx.fill()
      const bd=ctx.createRadialGradient(rx-9,ry-11,PR*.15,rx,ry,PR);bd.addColorStop(0,'rgba(255,255,255,.45)');bd.addColorStop(.25,c2);bd.addColorStop(1,'rgba(0,0,0,.55)');ctx.fillStyle=bd;ctx.beginPath();ctx.arc(rx,ry,PR,0,Math.PI*2);ctx.fill()
      ctx.strokeStyle=c2.replace('.9','.45');ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(rx,ry,PR+2,0,Math.PI*2);ctx.stroke()
      // 自己行星的指示器
      if(p.n===myNum){const t=now/1000;for(let i=0;i<3;i++){const a=t*2+i*Math.PI*2/3,ix=rx+Math.cos(a)*(PR+16+Math.sin(t*3)*4),iy=ry+Math.sin(a)*(PR+16+Math.sin(t*3)*4);ctx.fillStyle='rgba(255,255,255,.7)';ctx.beginPath();ctx.arc(ix,iy,3.5,0,Math.PI*2);ctx.fill()}}
    }

    // 陨石（插值后）
    for(const a of is.asteroids){
      const gg=ctx.createRadialGradient(a.x-1,a.y-1,a.r*.08,a.x,a.y,a.r);gg.addColorStop(0,'rgba(255,240,215,.9)');gg.addColorStop(.55,'rgba(170,130,90,.65)');gg.addColorStop(1,'rgba(70,40,25,.45)');ctx.fillStyle=gg;ctx.beginPath();ctx.arc(a.x,a.y,a.r,0,Math.PI*2);ctx.fill()
      ctx.fillStyle='rgba(255,255,255,.22)';ctx.beginPath();ctx.arc(a.x-a.r*.28,a.y-a.r*.32,a.r*.33,0,Math.PI*2);ctx.fill()
    }

    // 爆炸特效
    for(let i=effects.length-1;i>=0;i--){const e=effects[i];e.life-=.025;if(e.life<=0){effects.splice(i,1);continue}const rgb=e.player===1?'77,166,255':'255,85,85';for(let j=0;j<14;j++){const a=j/14*Math.PI*2+(1-e.life)*3.5,d=(1-e.life)*75;ctx.fillStyle='rgba('+rgb+','+e.life+')';ctx.beginPath();ctx.arc(e.x+Math.cos(a)*d,e.y+Math.sin(a)*d,e.life*3,0,Math.PI*2);ctx.fill()}const fg=ctx.createRadialGradient(e.x,e.y,0,e.x,e.y,45*e.life);fg.addColorStop(0,'rgba(255,255,255,'+(e.life*.7)+')');fg.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=fg;ctx.beginPath();ctx.arc(e.x,e.y,45*e.life,0,Math.PI*2);ctx.fill()}
  }

  ctx.restore();

  // HUD
  if(is){
    const me=is.players.find(p=>p.n===myNum),op=is.players.find(p=>p.n!==myNum);
    if(me)hp1.style.width=Math.max(0,me.hp/MAX_HP*100)+'%';
    if(op)hp2.style.width=Math.max(0,op.hp/MAX_HP*100)+'%';
    const mn=Math.floor(is.time/60),sc=is.time%60;td.textContent=mn+':'+String(sc).padStart(2,'0');td.classList.toggle('urgent',is.time<=30);
  }
}

// ====== 启动 ======
connect();requestAnimationFrame(render);
function checkURL(){const code=new URLSearchParams(location.search).get('join');if(code){document.getElementById('joinInput').value=code.toUpperCase();setTimeout(joinRoom,600)}}
checkURL();
c.addEventListener('click',()=>ac());c.addEventListener('touchstart',()=>ac(),{once:true});
</script>
</body>
</html>
