<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#061017">
  <title>重力决斗 · Gravity Duel</title>
  <style>
    :root {
      --ink: #061017;
      --panel: rgba(8, 23, 31, .92);
      --line: rgba(117, 242, 222, .23);
      --cyan: #75f2de;
      --cyan-dim: #2aaea2;
      --coral: #ff6f69;
      --text: #ebfffb;
      --muted: #83a4a5;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      display: grid;
      place-items: center;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 15%, rgba(31, 112, 116, .2), transparent 38%),
        #02070b;
      font-family: "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif;
      touch-action: none;
      user-select: none;
    }

    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    #app {
      position: relative;
      overflow: hidden;
      isolation: isolate;
      background: #061017;
      box-shadow: 0 0 70px rgba(0, 0, 0, .72);
    }

    #app::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        transparent 0 3px,
        rgba(117, 242, 222, .018) 3px 4px
      );
      mix-blend-mode: screen;
    }

    canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: max(20px, var(--safe-top)) max(20px, var(--safe-right))
        max(20px, var(--safe-bottom)) max(20px, var(--safe-left));
      background: rgba(2, 9, 13, .55);
      backdrop-filter: blur(8px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
    }
    .overlay.active { opacity: 1; pointer-events: auto; }
    .overlay.hidden { display: none; }

    .panel {
      width: min(480px, 92vw);
      padding: 34px;
      position: relative;
      border: 1px solid var(--line);
      background:
        linear-gradient(135deg, rgba(117, 242, 222, .08), transparent 34%),
        var(--panel);
      box-shadow: 0 26px 80px rgba(0, 0, 0, .5);
      clip-path: polygon(0 18px, 18px 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%);
    }
    .panel::after {
      content: "";
      position: absolute;
      left: 34px;
      top: 0;
      width: 82px;
      height: 2px;
      background: var(--cyan);
      box-shadow: 0 0 16px var(--cyan);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--cyan);
      font: 700 11px/1.2 ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: .24em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font: 900 clamp(42px, 7vw, 72px)/.88 "Arial Black", Impact, sans-serif;
      letter-spacing: -.07em;
      text-transform: uppercase;
    }
    h1 span { display: block; color: transparent; -webkit-text-stroke: 1px var(--cyan); }
    .subtitle { margin: 16px 0 26px; color: var(--muted); font-size: 14px; line-height: 1.65; }

    .actions { display: grid; gap: 12px; }
    .join-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; }

    .primary, .secondary, .compact {
      min-height: 48px;
      border: 1px solid var(--cyan-dim);
      color: var(--ink);
      background: var(--cyan);
      font-weight: 900;
      letter-spacing: .08em;
      cursor: pointer;
      transition: transform .12s, filter .12s, background .12s;
    }
    .primary:active, .secondary:active, .compact:active { transform: translateY(1px) scale(.99); }
    .primary:hover { filter: brightness(1.08); }
    .secondary, .compact {
      color: var(--cyan);
      background: rgba(117, 242, 222, .06);
    }
    .secondary:hover, .compact:hover { background: rgba(117, 242, 222, .13); }
    .compact { min-height: 38px; padding: 0 16px; font-size: 12px; }

    input {
      width: 100%;
      min-width: 0;
      height: 48px;
      padding: 0 14px;
      color: var(--text);
      border: 1px solid var(--line);
      outline: none;
      background: rgba(0, 0, 0, .25);
      font: 800 21px/1 ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: .24em;
      text-transform: uppercase;
    }
    input:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(117, 242, 222, .09); }

    #serverScope {
      margin: 16px 0 0;
      min-height: 32px;
      color: #7bcfc5;
      font-size: 12px;
      line-height: 1.5;
    }
    #serverScope.local { color: #ffc274; }
    #errorText { min-height: 20px; margin-top: 10px; color: #ff9793; font-size: 13px; }

    .room-code {
      margin: 12px 0 22px;
      color: var(--cyan);
      font: 900 clamp(42px, 11vw, 76px)/1 ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: .18em;
      text-shadow: 0 0 24px rgba(117, 242, 222, .34);
    }
    .waiting-pulse {
      width: 48px;
      height: 48px;
      margin: 0 auto 20px;
      border: 2px solid rgba(117, 242, 222, .16);
      border-top-color: var(--cyan);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #hud {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
    }
    #hud.hidden { display: none; }
    .hud-top {
      position: absolute;
      top: calc(14px + var(--safe-top));
      left: calc(16px + var(--safe-left));
      right: calc(16px + var(--safe-right));
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: start;
      gap: 14px;
    }
    .health { max-width: 260px; }
    .health.enemy { justify-self: end; text-align: right; }
    .health-label {
      margin-bottom: 5px;
      color: var(--muted);
      font: 700 10px/1 ui-monospace, monospace;
      letter-spacing: .16em;
    }
    .health-track {
      width: min(23vw, 260px);
      height: 8px;
      padding: 1px;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(0,0,0,.42);
    }
    .health-fill { height: 100%; width: 100%; background: var(--cyan); transition: width .18s ease; }
    .enemy .health-fill { margin-left: auto; background: var(--coral); }
    #timer {
      min-width: 76px;
      padding: 8px 12px;
      text-align: center;
      color: var(--text);
      border: 1px solid var(--line);
      background: rgba(4, 15, 20, .76);
      font: 900 21px/1 ui-monospace, monospace;
    }
    #netStats {
      position: absolute;
      right: calc(16px + var(--safe-right));
      bottom: calc(12px + var(--safe-bottom));
      color: rgba(235,255,251,.55);
      font: 600 10px/1 ui-monospace, monospace;
      letter-spacing: .08em;
    }

    #connectionBanner {
      position: absolute;
      z-index: 20;
      top: calc(12px + var(--safe-top));
      left: 50%;
      transform: translateX(-50%);
      padding: 9px 16px;
      color: #071014;
      background: #ffc274;
      font-size: 12px;
      font-weight: 900;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
    }
    #connectionBanner.visible { opacity: 1; }

    #mobileControls {
      display: none;
      position: absolute;
      z-index: 7;
      left: calc(18px + var(--safe-left));
      bottom: calc(18px + var(--safe-bottom));
      width: 160px;
      height: 160px;
      pointer-events: auto;
    }
    .dpad {
      position: absolute;
      width: 54px;
      height: 54px;
      color: var(--cyan);
      border: 1px solid rgba(117, 242, 222, .45);
      border-radius: 16px;
      background: rgba(4, 20, 25, .68);
      font-size: 24px;
      font-weight: 900;
      touch-action: none;
      backdrop-filter: blur(5px);
    }
    .dpad.pressed { color: var(--ink); background: var(--cyan); }
    .dpad[data-key="up"] { left: 53px; top: 0; }
    .dpad[data-key="left"] { left: 0; top: 53px; }
    .dpad[data-key="right"] { right: 0; top: 53px; }
    .dpad[data-key="down"] { left: 53px; bottom: 0; }
    .mobile.game-active #mobileControls { display: block; }

    #rotateOverlay {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 50;
      padding: 28px;
      place-items: center;
      text-align: center;
      color: var(--text);
      background:
        radial-gradient(circle at center, rgba(24, 81, 81, .35), transparent 52%),
        rgba(2, 8, 12, .97);
    }
    .portrait-mobile.game-active #rotateOverlay { display: grid; }
    .rotate-icon { font-size: 58px; animation: tilt 1.8s ease-in-out infinite; }
    @keyframes tilt { 0%,100% { transform: rotate(0); } 50% { transform: rotate(90deg); } }
    #rotateOverlay h2 { margin: 18px 0 8px; font-size: 24px; }
    #rotateOverlay p { margin: 0 0 20px; color: var(--muted); font-size: 13px; }

    .result-mark {
      color: var(--cyan);
      font: 900 14px/1 ui-monospace, monospace;
      letter-spacing: .2em;
    }
    #resultTitle { margin: 12px 0 8px; font-size: clamp(34px, 9vw, 62px); }
    #resultDetail { margin: 0 0 24px; color: var(--muted); }

    @media (max-width: 700px) {
      .panel { width: min(92vw, 430px); padding: 25px; }
      h1 { font-size: clamp(38px, 13vw, 64px); }
      .subtitle { margin-bottom: 20px; }
      .hud-top { top: calc(8px + var(--safe-top)); left: calc(10px + var(--safe-left)); right: calc(10px + var(--safe-right)); }
      .health-track { width: 25vw; }
      #timer { min-width: 62px; padding: 7px 8px; font-size: 17px; }
    }
    @media (max-height: 520px) and (orientation: landscape) {
      .panel { width: min(470px, 74vw); padding: 20px 26px; }
      h1 { font-size: 42px; }
      .subtitle { margin: 10px 0 14px; line-height: 1.4; }
      .actions { grid-template-columns: 1fr 1.2fr; }
      .actions > .primary { grid-row: span 2; }
      #serverScope { margin-top: 9px; }
      #mobileControls { width: 142px; height: 142px; bottom: calc(9px + var(--safe-bottom)); }
      .dpad { width: 48px; height: 48px; }
      .dpad[data-key="up"] { left: 47px; }
      .dpad[data-key="left"], .dpad[data-key="right"] { top: 47px; }
      .dpad[data-key="down"] { left: 47px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main id="app" aria-label="重力决斗游戏">
    <canvas id="c"></canvas>

    <section id="menuOverlay" class="overlay active">
      <div class="panel">
        <p class="eyebrow">Two-body orbital combat</p>
        <h1>Gravity<span>Duel</span></h1>
        <p class="subtitle">移动你的行星，用引力轨迹把陨石甩向对手。电脑使用 WASD / 方向键，手机使用左下角方向盘。</p>
        <div class="actions">
          <button id="createBtn" class="primary" type="button">创建房间</button>
          <div class="join-row">
            <input id="roomInput" maxlength="4" inputmode="text" autocomplete="off" aria-label="四位房间号" placeholder="房间号">
            <button id="joinBtn" class="secondary" type="button">加入</button>
          </div>
        </div>
        <p id="serverScope"></p>
        <div id="errorText" role="alert"></div>
      </div>
    </section>

    <section id="waitOverlay" class="overlay hidden">
      <div class="panel" style="text-align:center">
        <div class="waiting-pulse"></div>
        <p class="eyebrow">Awaiting challenger</p>
        <div id="roomCode" class="room-code">----</div>
        <p class="subtitle">把房间号发给朋友。双方必须打开同一个 Railway 公网地址。</p>
        <div style="display:flex;gap:10px;justify-content:center">
          <button id="copyBtn" class="compact" type="button">复制房间号</button>
          <button id="cancelWait" class="compact" type="button">取消</button>
        </div>
      </div>
    </section>

    <div id="hud" class="hidden">
      <div class="hud-top">
        <div class="health">
          <div class="health-label">YOU // <span id="myHpText">5</span></div>
          <div class="health-track"><div id="myHp" class="health-fill"></div></div>
        </div>
        <div id="timer">3:00</div>
        <div class="health enemy">
          <div class="health-label"><span id="otherHpText">5</span> // RIVAL</div>
          <div class="health-track"><div id="otherHp" class="health-fill"></div></div>
        </div>
      </div>
      <div id="netStats">-- FPS · -- ms</div>
    </div>

    <div id="mobileControls" aria-label="移动方向">
      <button class="dpad" data-key="up" type="button" aria-label="向上">↑</button>
      <button class="dpad" data-key="left" type="button" aria-label="向左">←</button>
      <button class="dpad" data-key="right" type="button" aria-label="向右">→</button>
      <button class="dpad" data-key="down" type="button" aria-label="向下">↓</button>
    </div>

    <div id="connectionBanner">网络波动，正在恢复对局…</div>

    <section id="endOverlay" class="overlay hidden">
      <div class="panel" style="text-align:center">
        <div class="result-mark">ROUND COMPLETE</div>
        <h2 id="resultTitle">对局结束</h2>
        <p id="resultDetail">准备下一次轨道交锋。</p>
        <div style="display:grid;gap:10px">
          <button id="rematchBtn" class="primary" type="button">再来一局</button>
          <button id="leaveBtn" class="secondary" type="button">返回大厅</button>
        </div>
      </div>
    </section>

    <div id="rotateOverlay">
      <div>
        <div class="rotate-icon">▯</div>
        <h2>请把手机横过来</h2>
        <p>场景会铺满屏幕，并保持行星为正圆、操作区域不变形。</p>
        <button id="fullscreenBtn" class="compact" type="button">尝试全屏横屏</button>
      </div>
    </div>
  </main>

  <script src="/game-math.js"></script>
  <script>
    (() => {
      'use strict';

      const GM = window.GravityMath;
      const W = GM.WORLD_WIDTH;
      const H = GM.WORLD_HEIGHT;
      const MAX_HP = 5;
      const SNAPSHOT_MS = 50;
      const app = document.getElementById('app');
      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d');
      const body = document.body;
      const elements = {
        menu: document.getElementById('menuOverlay'),
        wait: document.getElementById('waitOverlay'),
        end: document.getElementById('endOverlay'),
        hud: document.getElementById('hud'),
        serverScope: document.getElementById('serverScope'),
        error: document.getElementById('errorText'),
        roomInput: document.getElementById('roomInput'),
        roomCode: document.getElementById('roomCode'),
        myHp: document.getElementById('myHp'),
        otherHp: document.getElementById('otherHp'),
        myHpText: document.getElementById('myHpText'),
        otherHpText: document.getElementById('otherHpText'),
        timer: document.getElementById('timer'),
        stats: document.getElementById('netStats'),
        banner: document.getElementById('connectionBanner'),
        resultTitle: document.getElementById('resultTitle'),
        resultDetail: document.getElementById('resultDetail'),
        rematch: document.getElementById('rematchBtn'),
      };

      const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)
        || Math.min(window.innerWidth, window.innerHeight) < 700;
      const keys = { up: false, down: false, left: false, right: false };
      const tabIdentity = String(window.name || '').startsWith('gravity-duel-tab-')
        ? window.name
        : `gravity-duel-tab-${window.crypto?.randomUUID?.() || `${Date.now()}-${Math.random()}`}`;
      window.name = tabIdentity;
      const sessionKey = `gravity-duel-session-v2:${tabIdentity}`;
      const sessionStore = window.localStorage || window.sessionStorage || sessionStorage;
      const effects = [];
      const view = { width: 0, height: 0, scale: 1, offsetX: 0, offsetY: 0, dpr: 1 };
      let socket;
      let reconnectTimer;
      let reconnectAttempts = 0;
      let intentionalClose = false;
      let roomId = null;
      let playerNumber = 0;
      let sessionToken = null;
      let phase = 'menu';
      let currentSnapshot = null;
      let previousSnapshot = null;
      let snapshotReceivedAt = 0;
      let predictedPosition = null;
      let inputSequence = 0;
      let lastFrameAt = performance.now();
      let frameCounter = 0;
      let frameWindowStarted = performance.now();
      let fps = 0;
      let rtt = 0;
      let shake = 0;
      let backgroundCache = null;
      const planetSprites = new Map();
      const asteroidSprites = new Map();

      function setOverlay(active) {
        for (const overlay of [elements.menu, elements.wait, elements.end]) {
          const shown = overlay === active;
          overlay.classList.toggle('active', shown);
          overlay.classList.toggle('hidden', !shown);
        }
      }

      function setPhase(nextPhase) {
        phase = nextPhase;
        const playing = nextPhase === 'playing';
        body.classList.toggle('game-active', playing);
        elements.hud.classList.toggle('hidden', !playing);
        if (playing) setOverlay(null);
        updateLayout();
        saveSession();
      }

      function updateLayout() {
        const viewportWidth = window.innerWidth;
        const viewportHeight = window.innerHeight;
        const portrait = isMobile && viewportHeight > viewportWidth;
        body.classList.toggle('mobile', isMobile);
        body.classList.toggle('portrait-mobile', portrait);

        const stage = isMobile
          ? { width: viewportWidth, height: viewportHeight }
          : GM.fitContain(viewportWidth, viewportHeight, W / H);
        app.style.width = `${stage.width}px`;
        app.style.height = `${stage.height}px`;
        app.style.transform = 'none';

        view.width = stage.width;
        view.height = stage.height;
        view.dpr = Math.min(window.devicePixelRatio || 1, 2);
        view.scale = Math.min(stage.width / W, stage.height / H);
        view.offsetX = (stage.width - W * view.scale) / 2;
        view.offsetY = (stage.height - H * view.scale) / 2;
        canvas.width = Math.max(1, Math.round(stage.width * view.dpr));
        canvas.height = Math.max(1, Math.round(stage.height * view.dpr));
      }

      function showError(message) {
        elements.error.textContent = message;
      }

      function updateServerScope() {
        const local = ['localhost', '127.0.0.1', '::1'].includes(location.hostname);
        elements.serverScope.classList.toggle('local', local);
        elements.serverScope.textContent = local
          ? '当前是本机地址：手机无法加入。请打开 Railway 公网网址后再创建房间。'
          : `公网联机服务：${location.host} · 不同设备可加入同一房间`;
      }

      function wsUrl() {
        return `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}`;
      }

      let connected = false;

      function updateButtons() {
        const ready = connected;
        const createBtn = document.getElementById('createBtn');
        const joinBtn = document.getElementById('joinBtn');
        if (createBtn) {
          createBtn.disabled = !ready;
          createBtn.style.opacity = ready ? '1' : '.45';
        }
        if (joinBtn) {
          joinBtn.disabled = !ready;
          joinBtn.style.opacity = ready ? '1' : '.45';
        }
        if (!ready && phase === 'menu') {
          showError('正在连接服务器…');
        } else if (ready && elements.error.textContent === '正在连接服务器…') {
          showError('');
        }
      }

      function connect({ resume = false } = {}) {
        clearTimeout(reconnectTimer);
        connected = false;
        updateButtons();
        if (phase === 'menu') showError('正在连接服务器…');
        socket = new WebSocket(wsUrl());
        socket.onopen = () => {
          connected = true;
          updateButtons();
          if (phase === 'menu') showError('');
          if (resume && roomId && sessionToken) {
            send({ type: 'resume_room', roomId, sessionToken });
          } else {
            elements.banner.classList.remove('visible');
          }
        };
        socket.onmessage = handleMessage;
        socket.onclose = () => {
          connected = false;
          updateButtons();
          if (intentionalClose || (!roomId && phase === 'menu')) {
            if (phase === 'menu') showError('连接断开，正在重连…');
            // 自动重连（非主动关闭时）
            if (!intentionalClose) {
              const backoff = Math.min(3000, 400 * (2 ** Math.min(reconnectAttempts, 4)));
              reconnectAttempts += 1;
              reconnectTimer = setTimeout(() => connect({ resume: !!roomId }), backoff);
            }
            return;
          }
          elements.banner.textContent = '网络波动，正在恢复对局…';
          elements.banner.classList.add('visible');
          if (reconnectAttempts >= 4) {
            abandonSession('连接中断，对局已结束');
            return;
          }
          const delay = Math.min(2400, 350 * (2 ** reconnectAttempts));
          reconnectAttempts += 1;
          reconnectTimer = setTimeout(() => connect({ resume: true }), delay);
        };
      }

      function send(message) {
        if (socket?.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify(message));
          return true;
        }
        if (!connected && phase === 'menu') {
          showError('尚未连接到服务器，请稍候…');
        }
        return false;
      }

      function saveSession() {
        if (!roomId || !sessionToken) return;
        sessionStore.setItem(sessionKey, JSON.stringify({
          roomId,
          playerNumber,
          sessionToken,
          phase,
        }));
      }

      function restoreSession() {
        let saved;
        try {
          saved = JSON.parse(sessionStore.getItem(sessionKey) || 'null');
        } catch {
          sessionStore.removeItem(sessionKey);
          return false;
        }
        if (
          !saved
          || typeof saved.roomId !== 'string'
          || typeof saved.sessionToken !== 'string'
          || ![1, 2].includes(saved.playerNumber)
          || saved.phase !== 'playing'
        ) {
          sessionStore.removeItem(sessionKey);
          return false;
        }
        roomId = saved.roomId;
        playerNumber = saved.playerNumber;
        sessionToken = saved.sessionToken;
        phase = 'playing';
        elements.banner.textContent = '正在恢复刚才的对局…';
        elements.banner.classList.add('visible');
        setPhase('playing');
        return true;
      }

      function clearSession() {
        sessionStore.removeItem(sessionKey);
        roomId = null;
        sessionToken = null;
        playerNumber = 0;
      }

      function abandonSession(message) {
        clearTimeout(reconnectTimer);
        elements.banner.classList.remove('visible');
        clearSession();
        resetInput();
        currentSnapshot = null;
        previousSnapshot = null;
        predictedPosition = null;
        setPhase('menu');
        setOverlay(elements.menu);
        showError(message);
      }

      function acceptRoom(message) {
        roomId = message.roomId;
        playerNumber = message.player;
        sessionToken = message.sessionToken || sessionToken;
        reconnectAttempts = 0;
        saveSession();
      }

      function handleMessage(event) {
        let message;
        try {
          message = JSON.parse(event.data);
        } catch {
          return;
        }

        if (message.type === 'room_created') {
          acceptRoom(message);
          elements.roomCode.textContent = roomId;
          showError('');
          setPhase('waiting');
          setOverlay(elements.wait);
        } else if (message.type === 'joined') {
          acceptRoom(message);
          showError('');
        } else if (message.type === 'game_start') {
          currentSnapshot = null;
          previousSnapshot = null;
          predictedPosition = null;
          resetInput();
          setPhase('playing');
        } else if (message.type === 'game_state') {
          previousSnapshot = currentSnapshot;
          currentSnapshot = message;
          snapshotReceivedAt = performance.now();
          reconcilePrediction(message);
          updateHud(message);
        } else if (message.type === 'hit') {
          spawnHitEffect(message.x, message.y, message.player);
          if (message.player === playerNumber) shake = 11;
        } else if (message.type === 'game_over') {
          showGameOver(message.winner, message.reason);
        } else if (message.type === 'rematch_requested') {
          elements.resultDetail.textContent = '对手已准备，再点一次“再来一局”即可开始。';
        } else if (message.type === 'opponent_connection_lost') {
          elements.banner.textContent = `对手掉线，保留房间 ${Math.round(message.graceMs / 1000)} 秒…`;
          elements.banner.classList.add('visible');
        } else if (message.type === 'opponent_reconnected') {
          elements.banner.classList.remove('visible');
        } else if (message.type === 'resumed') {
          acceptRoom({ ...message, sessionToken });
          reconnectAttempts = 0;
          elements.banner.classList.remove('visible');
          setPhase('playing');
        } else if (message.type === 'resume_failed') {
          abandonSession('房间已过期，请重新创建或加入');
        } else if (message.type === 'pong') {
          rtt = Math.max(0, Date.now() - message.clientTime);
        } else if (message.type === 'error') {
          showError(message.message);
          if (phase !== 'playing') setOverlay(elements.menu);
        }
      }

      function reconcilePrediction(snapshot) {
        const authoritative = snapshot.players?.find(player => player.n === playerNumber);
        if (!authoritative) return;
        const lead = Math.min(0.1, Math.max(0, rtt / 2000 + 0.025));
        const target = GM.integratePosition(authoritative, keys, lead);
        if (!predictedPosition || Math.hypot(
          target.x - predictedPosition.x,
          target.y - predictedPosition.y,
        ) > 90) {
          predictedPosition = target;
          return;
        }
        predictedPosition.x = GM.lerp(predictedPosition.x, target.x, 0.36);
        predictedPosition.y = GM.lerp(predictedPosition.y, target.y, 0.36);
      }

      function updateHud(snapshot) {
        const mine = snapshot.players?.find(player => player.n === playerNumber);
        const rival = snapshot.players?.find(player => player.n !== playerNumber);
        if (mine) {
          elements.myHp.style.width = `${GM.clamp(mine.hp / MAX_HP, 0, 1) * 100}%`;
          elements.myHpText.textContent = mine.hp;
        }
        if (rival) {
          elements.otherHp.style.width = `${GM.clamp(rival.hp / MAX_HP, 0, 1) * 100}%`;
          elements.otherHpText.textContent = rival.hp;
        }
        const seconds = Math.max(0, snapshot.time || 0);
        elements.timer.textContent = `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, '0')}`;
      }

      function showGameOver(winner, reason) {
        resetInput();
        setPhase('ended');
        const won = winner === playerNumber;
        const draw = winner === 0;
        elements.resultTitle.textContent = draw ? '势均力敌' : won ? '轨道胜利' : '引力失控';
        elements.resultDetail.textContent = reason === 'opponent_disconnected'
          ? '对手断线超时，本局结束。'
          : draw ? '双方剩余生命相同。' : won ? '你的引力场控制了整个战场。' : '调整移动节奏，再试一次。';
        elements.rematch.textContent = '再来一局';
        elements.rematch.disabled = false;
        setOverlay(elements.end);
      }

      function sendInput(force = false) {
        if (phase !== 'playing') return;
        inputSequence += 1;
        send({ type: 'input', seq: inputSequence, keys: { ...keys }, force });
      }

      function setKey(name, value) {
        if (keys[name] === value) return;
        keys[name] = value;
        sendInput();
      }

      function resetInput() {
        let changed = false;
        for (const name of Object.keys(keys)) {
          if (keys[name]) changed = true;
          keys[name] = false;
        }
        for (const button of document.querySelectorAll?.('.dpad') || []) {
          button.classList.remove('pressed');
        }
        if (changed) sendInput(true);
      }

      const keyMap = {
        ArrowUp: 'up', KeyW: 'up',
        ArrowDown: 'down', KeyS: 'down',
        ArrowLeft: 'left', KeyA: 'left',
        ArrowRight: 'right', KeyD: 'right',
      };
      window.addEventListener('keydown', event => {
        const name = keyMap[event.code];
        if (!name) return;
        event.preventDefault();
        setKey(name, true);
      });
      window.addEventListener('keyup', event => {
        const name = keyMap[event.code];
        if (!name) return;
        event.preventDefault();
        setKey(name, false);
      });
      window.addEventListener('blur', resetInput);
      window.addEventListener('resize', updateLayout);
      window.addEventListener('orientationchange', () => setTimeout(updateLayout, 80));

      for (const button of document.querySelectorAll?.('.dpad') || []) {
        const name = button.dataset.key;
        const press = event => {
          event.preventDefault();
          button.setPointerCapture?.(event.pointerId);
          button.classList.add('pressed');
          setKey(name, true);
        };
        const release = event => {
          event.preventDefault();
          button.classList.remove('pressed');
          setKey(name, false);
        };
        button.addEventListener('pointerdown', press);
        button.addEventListener('pointerup', release);
        button.addEventListener('pointercancel', release);
        button.addEventListener('pointerleave', release);
        button.addEventListener('lostpointercapture', release);
      }
      // 全局兜底：触摸被系统中断（来电、通知等）时复位所有按键
      if (document.addEventListener) {
        document.addEventListener('touchcancel', resetInput);
        document.addEventListener('pointercancel', () => {
          for (const button of document.querySelectorAll?.('.dpad') || []) {
            button.classList.remove('pressed');
          }
          resetInput();
        });
      }

      document.getElementById('createBtn').addEventListener('click', () => {
        showError('');
        send({ type: 'create_room' });
      });
      document.getElementById('joinBtn').addEventListener('click', () => {
        const code = elements.roomInput.value.trim().toUpperCase();
        if (code.length !== 4) {
          showError('请输入四位房间号');
          return;
        }
        showError('');
        send({ type: 'join_room', roomId: code });
      });
      elements.roomInput.addEventListener('keydown', event => {
        if (event.key === 'Enter') document.getElementById('joinBtn').click();
      });
      document.getElementById('copyBtn').addEventListener('click', async () => {
        const text = `重力决斗房间 ${roomId}：${location.origin}`;
        try {
          await navigator.clipboard.writeText(text);
          document.getElementById('copyBtn').textContent = '已复制';
        } catch {
          prompt('复制下面的邀请信息', text);
        }
      });
      document.getElementById('cancelWait').addEventListener('click', () => {
        intentionalClose = true;
        socket?.close();
        clearSession();
        setPhase('menu');
        setOverlay(elements.menu);
        connect();
        intentionalClose = false;
      });
      elements.rematch.addEventListener('click', () => {
        send({ type: 'rematch' });
        elements.rematch.disabled = true;
        elements.rematch.textContent = '等待对手…';
      });
      document.getElementById('leaveBtn').addEventListener('click', () => {
        intentionalClose = true;
        socket?.close();
        clearSession();
        currentSnapshot = null;
        previousSnapshot = null;
        predictedPosition = null;
        setPhase('menu');
        setOverlay(elements.menu);
        connect();
        intentionalClose = false;
      });
      document.getElementById('fullscreenBtn').addEventListener('click', async () => {
        try {
          await document.documentElement.requestFullscreen?.();
          await screen.orientation?.lock?.('landscape');
        } catch {
          // iOS 通常不允许锁定方向，用户仍可手动横屏。
        }
      });

      function createBackground() {
        const cache = document.createElement('canvas');
        cache.width = W;
        cache.height = H;
        const buffer = cache.getContext?.('2d');
        if (!buffer) return null;

        buffer.fillStyle = '#061017';
        buffer.fillRect(0, 0, W, H);
        const nebula = buffer.createRadialGradient(260, 150, 20, 260, 150, 430);
        nebula.addColorStop(0, 'rgba(24, 103, 106, .32)');
        nebula.addColorStop(1, 'rgba(2, 8, 12, 0)');
        buffer.fillStyle = nebula;
        buffer.fillRect(0, 0, W, H);

        buffer.strokeStyle = 'rgba(117, 242, 222, .045)';
        buffer.lineWidth = 1;
        buffer.beginPath();
        for (let x = 0; x <= W; x += 50) { buffer.moveTo(x, 0); buffer.lineTo(x, H); }
        for (let y = 0; y <= H; y += 50) { buffer.moveTo(0, y); buffer.lineTo(W, y); }
        buffer.stroke();

        let seed = 73421;
        const random = () => {
          seed = (seed * 16807) % 2147483647;
          return (seed - 1) / 2147483646;
        };
        for (let index = 0; index < 150; index += 1) {
          const alpha = 0.18 + random() * 0.62;
          buffer.fillStyle = `rgba(210, 255, 249, ${alpha})`;
          const radius = random() > 0.9 ? 1.35 : 0.7;
          buffer.beginPath();
          buffer.arc(random() * W, random() * H, radius, 0, Math.PI * 2);
          buffer.fill();
        }
        return cache;
      }

      function createPlanetSprite(color) {
        const size = 480;
        const cache = document.createElement('canvas');
        cache.width = size;
        cache.height = size;
        const buffer = cache.getContext?.('2d');
        if (!buffer) return null;
        const center = size / 2;
        const halo = buffer.createRadialGradient(center, center, 34, center, center, 228);
        halo.addColorStop(0, `${color}42`);
        halo.addColorStop(.48, `${color}14`);
        halo.addColorStop(1, `${color}00`);
        buffer.fillStyle = halo;
        buffer.fillRect(0, 0, size, size);
        buffer.strokeStyle = `${color}42`;
        buffer.lineWidth = 1.5;
        buffer.beginPath();
        buffer.arc(center, center, 222, 0, Math.PI * 2);
        buffer.stroke();
        const globe = buffer.createRadialGradient(center - 13, center - 14, 3, center, center, 40);
        globe.addColorStop(0, '#ffffff');
        globe.addColorStop(.18, color);
        globe.addColorStop(1, '#06151b');
        buffer.fillStyle = globe;
        buffer.beginPath();
        buffer.arc(center, center, 38, 0, Math.PI * 2);
        buffer.fill();
        buffer.strokeStyle = color;
        buffer.lineWidth = 2;
        buffer.stroke();
        return cache;
      }

      function asteroidSprite(radius) {
        const bucket = Math.round(radius / 2) * 2;
        if (asteroidSprites.has(bucket)) return asteroidSprites.get(bucket);
        const size = 40;
        const cache = document.createElement('canvas');
        cache.width = size;
        cache.height = size;
        const buffer = cache.getContext?.('2d');
        if (!buffer) return null;
        const gradient = buffer.createRadialGradient(16, 14, 2, 20, 20, bucket + 3);
        gradient.addColorStop(0, '#edf8e9');
        gradient.addColorStop(.28, '#b5beb7');
        gradient.addColorStop(1, '#354046');
        buffer.fillStyle = gradient;
        buffer.strokeStyle = '#d1ded7';
        buffer.lineWidth = 1;
        buffer.beginPath();
        for (let point = 0; point < 9; point += 1) {
          const angle = point / 9 * Math.PI * 2;
          const r = bucket * (point % 2 ? .83 : 1);
          const x = 20 + Math.cos(angle) * r;
          const y = 20 + Math.sin(angle) * r;
          if (point === 0) buffer.moveTo(x, y);
          else buffer.lineTo(x, y);
        }
        buffer.closePath();
        buffer.fill();
        buffer.stroke();
        asteroidSprites.set(bucket, cache);
        return cache;
      }

      function spawnHitEffect(x, y, hitPlayer) {
        const color = hitPlayer === playerNumber ? '#ff6f69' : '#75f2de';
        for (let index = 0; index < 11; index += 1) {
          const angle = Math.PI * 2 * index / 11 + Math.random() * .25;
          const speed = 80 + Math.random() * 130;
          effects.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: .55,
            maxLife: .55,
            color,
          });
        }
      }

      function drawPlanet(player, x, y) {
        const mine = player.n === playerNumber;
        const color = mine ? '#75f2de' : '#ff6f69';
        let sprite = planetSprites.get(color);
        if (!sprite) {
          sprite = createPlanetSprite(color);
          planetSprites.set(color, sprite);
        }
        if (sprite) ctx.drawImage(sprite, x - 240, y - 240, 480, 480);
        else {
          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.arc(x, y, 38, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = mine ? '#061017' : '#fff7f5';
        ctx.font = '900 13px ui-monospace, monospace';
        ctx.textAlign = 'center';
        ctx.fillText(mine ? 'YOU' : 'RIVAL', x, y + 5);
      }

      function drawFrame(now) {
        const dt = Math.min(.05, Math.max(0, (now - lastFrameAt) / 1000));
        lastFrameAt = now;
        frameCounter += 1;
        if (now - frameWindowStarted >= 500) {
          fps = Math.round(frameCounter * 1000 / (now - frameWindowStarted));
          frameCounter = 0;
          frameWindowStarted = now;
          elements.stats.textContent = `${fps} FPS · ${rtt || '--'} ms`;
        }

        ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
        ctx.fillStyle = '#02070b';
        ctx.fillRect(0, 0, view.width, view.height);

        const shakeX = shake > .1 ? (Math.random() - .5) * shake : 0;
        const shakeY = shake > .1 ? (Math.random() - .5) * shake : 0;
        shake = Math.max(0, shake - dt * 42);
        ctx.save();
        ctx.setTransform(
          view.dpr * view.scale,
          0,
          0,
          view.dpr * view.scale,
          view.dpr * (view.offsetX + shakeX),
          view.dpr * (view.offsetY + shakeY),
        );

        if (backgroundCache) ctx.drawImage(backgroundCache, 0, 0);
        else {
          ctx.fillStyle = '#061017';
          ctx.fillRect(0, 0, W, H);
        }

        if (currentSnapshot) {
          const alpha = GM.clamp((now - snapshotReceivedAt) / SNAPSHOT_MS, 0, 1);
          const visual = GM.interpolateSnapshot(previousSnapshot, currentSnapshot, alpha);
          if (phase === 'playing') {
            if (!predictedPosition) {
              const mine = visual.players.find(player => player.n === playerNumber);
              if (mine) predictedPosition = { x: mine.x, y: mine.y };
            } else {
              predictedPosition = GM.integratePosition(predictedPosition, keys, dt);
            }
          }

          for (const asteroid of visual.asteroids) {
            ctx.strokeStyle = 'rgba(207, 233, 225, .18)';
            ctx.lineWidth = Math.max(1, asteroid.r * .24);
            ctx.beginPath();
            ctx.moveTo(asteroid.x, asteroid.y);
            ctx.lineTo(asteroid.x - asteroid.vx * 3.5, asteroid.y - asteroid.vy * 3.5);
            ctx.stroke();
            const sprite = asteroidSprite(asteroid.r);
            if (sprite) ctx.drawImage(sprite, asteroid.x - 20, asteroid.y - 20, 40, 40);
          }

          for (const player of visual.players) {
            const local = player.n === playerNumber && predictedPosition;
            drawPlanet(player, local ? predictedPosition.x : player.x, local ? predictedPosition.y : player.y);
          }
        }

        for (let index = effects.length - 1; index >= 0; index -= 1) {
          const particle = effects[index];
          particle.life -= dt;
          if (particle.life <= 0) {
            effects.splice(index, 1);
            continue;
          }
          particle.x += particle.vx * dt;
          particle.y += particle.vy * dt;
          particle.vx *= Math.pow(.04, dt);
          particle.vy *= Math.pow(.04, dt);
          ctx.globalAlpha = particle.life / particle.maxLife;
          ctx.fillStyle = particle.color;
          ctx.fillRect(particle.x - 2, particle.y - 2, 4, 4);
        }
        ctx.globalAlpha = 1;
        ctx.restore();
        requestAnimationFrame(drawFrame);
      }

      setInterval(() => sendInput(true), 100);
      setInterval(() => {
        if (socket?.readyState === WebSocket.OPEN) send({ type: 'ping', clientTime: Date.now() });
      }, 2000);

      backgroundCache = createBackground();
      updateServerScope();
      updateLayout();
      const restoringSession = restoreSession();
      connect({ resume: restoringSession });
      requestAnimationFrame(drawFrame);
    })();
  </script>
</body>
</html>
